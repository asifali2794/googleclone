<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Responsive Google Homepage Clone</title>
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-wrapper">
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <div class="app">
          <i class="ri-more-fill"></i>
          <i class="ri-more-fill"></i>
          <i class="ri-more-fill"></i>
        </div>
        <div class="account">
          <img src="unnamed.jpg" />
        </div>
      </div>
    </nav>
    <main>
      <img class="logo" src="pngimg.com - google_PNG19644.png" />
      <div class="search">
        <span class="ri-search-2-line"></span>
        <input type="text" />
        <img src="Google_mic.svg.png" alt="" />
      </div>
      <div class="search-button">
        <button>Google Search</button>
        <button>I'm Feeling Lucky</button>
      </div>
      <div class="search-language">
        <p>Google Offered in:</p>
        <a href="#">Karachi</a>
        <a href="#">Pakistan</a>
      </div>
    </main>
    <footer>
      <div class="footer-location">karachi</div>
      <div class="footer-menu">
        <div class="left-menu">
          <a href="#">About</a>
          <a href="#">Advertising</a>
          <a href="#">Business</a>
          <a href="#">How Search Works</a>
        </div>
        <div class="right-menu">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Settings</a>
        </div>
      </div>
    </footer>
  </body>
</html>
